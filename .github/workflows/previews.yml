name: Capture project previews

# Manual only: screenshots change when the projects do, and a scheduled run
# would commit whatever a site was doing at 5am, error page included.
on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Project ids to capture, space separated. Empty captures all.'
        required: false
        default: ''

# To a dedicated branch, never the one dispatched from: generated binaries
# should arrive by pull request, where they can be looked at.
permissions:
  contents: write

concurrency:
  group: previews
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium, and only its own dependencies. The full install pulls
      # three browsers for a job that uses one.
      - run: npx playwright install --with-deps chromium

      - name: Capture
        run: node scripts/shots.mjs ${{ inputs.projects }}

      # An unreadable or absurd image should fail here, not in the deploy.
      - name: Build with the new screenshots
        run: npm run build:fast

      - name: Push to the previews branch
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Staged first: `git diff` alone ignores untracked files, so the
          # first capture looked like no change and skipped the push.
          git add src/assets/previews
          if git diff --cached --quiet -- src/assets/previews; then
            echo "The captured screenshots are identical to the committed ones."
            exit 0
          fi

          # Recreated each run: this carries generated output, so its history
          # is noise. Staged changes survive the checkout.
          git checkout -B previews/auto
          git commit -m 'Capture project previews' \
                     -m "Produced by scripts/shots.mjs on run ${{ github.run_id }}, from ${{ github.sha }}."
          git push --force origin previews/auto

          echo "### Screenshots updated" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed to \`previews/auto\`. Open a pull request from that branch to ship them." >> "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD~1 -- src/assets/previews >> "$GITHUB_STEP_SUMMARY" || true
