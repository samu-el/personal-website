name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  # The Now page reads GitHub and Letterboxd at build time; a daily rebuild
  # keeps both current without a push. 05:00 UTC is 08:00 in Addis Ababa.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede rather than cancel mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build:fast
        env:
          # Defaults target the custom domain smr.et at the root. Repository
          # variables SITE / BASE override them without touching this file.
          SITE: ${{ vars.SITE || 'https://smr.et' }}
          BASE: ${{ vars.BASE || '/' }}
          # Lifts the build's GitHub API calls off the runner's shared
          # anonymous rate limit. Read-only; the build never writes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Spotify. Absent until the three repository secrets are set, and the
          # feed is simply not rendered until then. Never exposed to the
          # browser: Astro inlines only PUBLIC_* variables into client code.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - uses: actions/configure-pages@v5
        with:
          # Only effective where the caller's credentials can create a Pages
          # site. The default GITHUB_TOKEN cannot, whatever its permissions —
          # so Pages must be switched on once by hand:
          #   Settings → Pages → Build and deployment → Source: GitHub Actions
          # After that this step just reads the existing config and passes.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
