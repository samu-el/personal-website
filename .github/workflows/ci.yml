name: CI

# pull_request only: with `push: branches-ignore` as well, every push to a PR branch ran this
# twice. Deploys (deploy.yml) build the site again on master, so nothing is lost there either.
on:
  pull_request:
    # Named files, not '**.md': the project pages in src/content/ are Markdown
    # and are built into the site.
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'PROFILE.md'
      - 'design.md'
      - 'docs/**'
      - '.hallmark/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A normal run takes under two minutes. The cap stops a stuck step from
    # billing a quarter of an hour.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # agentlint needs 22.19 or later.
          node-version: '>=22.19 <23'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build:fast
        env:
          # Same as the deploy workflow: keeps the build's GitHub API calls off
          # the runner's shared anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: npx prettier --check .

      # The AGENTS.md rules agentlint can read (.agentlint/config.ts). The
      # Astro, Markdown and CSS half runs in the unit tests above.
      - name: Agent rules
        run: npm run lint:agent

      # Markup, SEO, feeds and the showcase invariants are properties of the
      # built HTML, so they are read straight out of dist/ before a browser is
      # installed. A failure here costs seconds, not a Chromium download.
      - name: Static checks over the built site
        run: npm run test:static

      # No Chromium download: the runner image ships Google Chrome, and the
      # harness launches whatever CHROMIUM_PATH names. The download plus its
      # apt dependencies took 30 s on a good day and 13 min on a bad one.
      - name: Browser checks over the built site
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/ --timeout 60000
          npm run verify

      # Same server: the interaction suite drives the pointer, the keyboard
      # and the scroll, which no static check can stand in for.
      - name: Interaction test the built site
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run verify:interact
