name: Deploy now-playing Worker

# Publishes worker/ to Cloudflare as `smr-now-playing` on the smr.et/api/* route
# (worker/wrangler.jsonc). Runs when the Worker changes, or by hand.
on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:
      # Edit, plus Workers Routes: Edit on the smr.et zone) and
      # CLOUDFLARE_ACCOUNT_ID. The Spotify secrets are the ones the site build
      # already uses; the refresh token must carry user-read-currently-playing.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            SPOTIFY_CLIENT_ID
            SPOTIFY_CLIENT_SECRET
            SPOTIFY_REFRESH_TOKEN
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
