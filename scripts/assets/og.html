<!doctype html>
<meta charset="utf-8" />
<title>Social card</title>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
      format('woff2-variations');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2')
      format('woff2-variations');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Instrument Serif';
    src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2')
      format('woff2');
    font-style: normal;
  }
  @font-face {
    font-family: 'Instrument Serif';
    src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2')
      format('woff2');
    font-style: italic;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #131417 0%, #0a0a0b 100%);
    color: #ececea;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 68px 72px 56px;
    display: flex;
    flex-direction: column;
  }

  /* Quarter-column hairlines and the gold top rule, matching the site's hero. */
  .grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(to right, rgb(255 255 255 / 0.07) 1px, transparent 1px);
    background-size: 25% 100%;
  }
  .top-rule {
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: #e9a23b;
  }

  header {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .mark {
    width: 62px;
    height: 62px;
    flex: none;
    display: grid;
    place-items: center;
    border: 1.5px solid rgb(255 255 255 / 0.2);
    border-radius: 999px;
    font-family: 'Geist Mono', monospace;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: #e9a23b;
  }
  .name {
    font-size: 25px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .role {
    margin-top: 5px;
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #96979d;
  }

  h1 {
    position: relative;
    margin-top: auto;
    margin-bottom: auto;
    font-family: 'Instrument Serif', serif;
    font-size: 96px;
    font-weight: 400;
    line-height: 0.99;
    letter-spacing: -0.015em;
  }
  h1 em {
    display: block;
    color: #e9a23b;
  }

  footer {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgb(255 255 255 / 0.1);
    padding-top: 30px;
    font-family: 'Geist Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #96979d;
  }
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 12px;
    border-radius: 999px;
    background: #4abe8a;
    vertical-align: 1px;
  }
</style>

<div class="grid"></div>
<div class="top-rule"></div>

<header>
  <div class="mark">SM</div>
  <div>
    <div class="name">Samuel Mussie</div>
    <div class="role">Co-founder &amp; CTO · Mereb Technologies</div>
  </div>
</header>

<h1>
  Senior engineering teams,
  <em>built in Addis Ababa.</em>
</h1>

<footer>
  <span><span class="dot"></span>Addis Ababa, Ethiopia</span>
  <span>samuel@mereb.tech</span>
</footer>
