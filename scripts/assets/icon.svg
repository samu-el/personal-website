<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SM">
  <style>
    /* A dark tab bar swallows the ink tile and its faint ring: lift the tile
       to the raised surface tone and the ring to a readable gold. */
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1a1b1f; }
      .ring { stroke-opacity: 0.85; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" fill="#0c0c0d"/>
  <rect class="ring" x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#e9a23b" stroke-opacity="0.35" stroke-width="2"/>
  <text x="32" y="43" text-anchor="middle"
        font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace"
        font-size="26" font-weight="500" letter-spacing="-1" fill="#e9a23b">SM</text>
</svg>
