<!doctype html>
<meta charset="utf-8" />
<title>App icon</title>
<style>
  @font-face {
    font-family: 'Geist Mono';
    src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2')
      format('woff2-variations');
    font-weight: 100 900;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  body {
    width: 512px;
    height: 512px;
    display: grid;
    place-items: center;
    background: #0c0c0d;
    -webkit-font-smoothing: antialiased;
  }
  .ring {
    width: 512px;
    height: 512px;
    display: grid;
    place-items: center;
    border: 14px solid rgb(233 162 59 / 0.35);
    border-radius: 112px;
    font-family: 'Geist Mono', monospace;
    font-size: 208px;
    font-weight: 500;
    letter-spacing: -8px;
    color: #e9a23b;
  }
  /* Full-bleed variants, picked by gen-images.mjs. The platform draws its own
     mask over these (iOS rounds the corners, Android crops to its shape), so
     a baked-in ring would be clipped at the corners. */
  .bleed .ring {
    border: 0;
    border-radius: 0;
  }
  /* Maskable: the glyph must sit inside the central 80% circle that every
     mask shape keeps, so it is set smaller than on the plain tile. */
  .maskable .ring {
    font-size: 168px;
    letter-spacing: -6px;
  }
</style>
<div class="ring">SM</div>
