<text xml:space="preserve" x="60" y="567.1" fill="#16171a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="start"><tspan x="60" dy="0">The line that explains the rest</tspan></text>
<text xml:space="preserve" x="60" y="593.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">component    the element model, rendering, export, and the encrypt/serialise step.</tspan><tspan x="60" dy="17.5">             Knows nothing about where anything goes.</tspan><tspan x="60" dy="17.5">application  rooms, share links, storage, the PWA. The shareable-link button</tspan><tspan x="60" dy="17.5">             exists only when a host passes onExportToBackend.</tspan><tspan x="60" dy="17.5">the key      lives in the URL fragment, which a browser never sends to a server.</tspan><tspan x="60" dy="17.5">             So the room server routes an id it can see and relays bytes it cannot read.</tspan><tspan x="60" dy="17.5">no accounts  no server-side copy, no cross-device sync. Excalidraw+ is a separate product.</tspan></text>
</svg>
