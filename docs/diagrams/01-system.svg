<text xml:space="preserve" x="60" y="647.1" fill="#16171a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="start"><tspan x="60" dy="0">Secrets never reach the browser</tspan></text>
<text xml:space="preserve" x="60" y="673.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">Build-time secrets (Spotify, GitHub token) are read through process.env in CI only —</tspan><tspan x="60" dy="17.5">Astro inlines nothing into client JS except PUBLIC_*. The Worker holds the refresh token</tspan><tspan x="60" dy="17.5">as an encrypted Worker secret. The page only ever sees trimmed JSON.</tspan></text>
