<text xml:space="preserve" x="60" y="627.1" fill="#16171a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="start"><tspan x="60" dy="0">Rules this layout enforces</tspan></text>
<text xml:space="preserve" x="60" y="653.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">processed     every module above is a processed &lt;script&gt;, so Astro bundles</tspan><tspan x="60" dy="17.5">              and dedupes them. Only the theme script is inline, because it</tspan><tspan x="60" dy="17.5">              has to run before first paint.</tspan><tspan x="60" dy="17.5">no define:vars it forces a script inline, which forbids imports. Data reaches</tspan><tspan x="60" dy="17.5">              the client through the DOM instead.</tspan><tspan x="60" dy="17.5">no router      navigation is native cross-document view transitions, so</tspan><tspan x="60" dy="17.5">              astro:page-load never fires and nothing re-initialises.</tspan><tspan x="60" dy="17.5">three gates    env.ts answers prefers-reduced-motion, pointer: fine and the</tspan><tspan x="60" dy="17.5">              colour scheme once, for every module that asks.</tspan></text>
