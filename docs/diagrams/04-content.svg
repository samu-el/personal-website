<text xml:space="preserve" x="60" y="433.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">draft      hidden in production, visible while developing</tspan><tspan x="60" dy="17.5">aiWritten  never rendered, in any environment, ever — the site publishes</tspan><tspan x="60" dy="17.5">           only Samuel’s own words, and the build enforces it rather than</tspan><tspan x="60" dy="17.5">           trusting anyone to remember</tspan><tspan x="60" dy="17.5">hidden     a project kept out of the showcase; still listed under “Also public”</tspan></text>
