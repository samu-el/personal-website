<text xml:space="preserve" x="60" y="627.1" fill="#16171a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="start"><tspan x="60" dy="0">What each one is for</tspan></text>
<text xml:space="preserve" x="60" y="653.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">verify      every route renders: one h1, no overflow, no broken internal link,</tspan><tspan x="60" dy="17.5">            no image without alt, no link without a name, theme persists</tspan><tspan x="60" dy="17.5">interact    what only exists under a pointer, a key or a scroll — the mobile</tspan><tspan x="60" dy="17.5">            panel, the entrance, tilt and lean, the poll cadence, reduced motion</tspan><tspan x="60" dy="17.5">feeds       the parsers, against recorded payloads, so no network is needed</tspan><tspan x="60" dy="17.5">worker      every debug reason string, token reuse, 429 handling, last-good</tspan></text>
