<text xml:space="preserve" x="60" y="627.1" fill="#16171a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="start"><tspan x="60" dy="0">What each one is for</tspan></text>
<text xml:space="preserve" x="60" y="653.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">static      read out of dist/, no browser: one h1, no broken internal link, no</tspan><tspan x="60" dy="17.5">            image without alt, no link without a name, the SEO block, the feeds</tspan><tspan x="60" dy="17.5">interact    what only exists under a pointer, a key or a scroll — the entrance,</tspan><tspan x="60" dy="17.5">            the header, the now-playing skeleton, a hidden tab, reduced motion</tspan><tspan x="60" dy="17.5">verify      what a browser is actually for: overflow at three viewports, an</tspan><tspan x="60" dy="17.5">            error-free console, the theme surviving a navigation, the reveal</tspan><tspan x="60" dy="17.5">schedule    the poll cadence, to the millisecond, as a pure function</tspan><tspan x="60" dy="17.5">worker      every debug reason string, token reuse, 429 handling, last-good</tspan></text>
</svg>
