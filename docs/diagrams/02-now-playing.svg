<text xml:space="preserve" x="60" y="533.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">loading  skeleton, set before first paint, aria-busy, link inert</tspan><tspan x="60" dy="17.5">ready    content swapped in; bars clear themselves (textContent)</tspan><tspan x="60" dy="17.5">empty    no Worker, no track, or a failed request — card removed</tspan></text>
