<text xml:space="preserve" x="60" y="543.3" fill="#6b6d76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start"><tspan x="60" dy="0">1. prefers-reduced-motion collapses every duration AND delay to nothing</tspan><tspan x="60" dy="17.5">2. (hover: hover) and (pointer: fine) guards anything cursor-driven</tspan><tspan x="60" dy="17.5">3. .js on &lt;html&gt; opts in anything a failed script must not leave hidden</tspan></text>
